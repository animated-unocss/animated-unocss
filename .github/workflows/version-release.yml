name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.TOKEN}}
